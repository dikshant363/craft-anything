[package]
name = "craft-core"
version = "0.1.0"
edition = "2021"
authors = ["Craft Anything Contributors"]
license = "Apache-2.0"
description = "Core engine for Craft Anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
jni-export = ["dep:jni"]

[dependencies.jni]
version = "0.21"
default-features = false
optional = true
